<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reunión Transporte</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#1E1E24; --panel:#16161C; --panel2:#111116; --line:#2A2A35; --line2:#3F3F46;
    --txt:#F3F4F6; --mut:#9CA3AF; --dim:#606070;
    --red:#EF4444; --amber:#F59E0B; --green:#22C55E; --blue:#38BDF8; --violet:#8B5CF6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Outfit',system-ui,sans-serif;font-size:14px}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:10}
  header h1{font-size:18px;font-weight:800;letter-spacing:.02em;margin-right:auto}
  header h1 span{color:var(--mut);font-weight:500;font-size:14px;margin-left:8px}
  .btn{background:#2D2D3A;border:1px solid var(--line2);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
  .btn:hover{border-color:#6A6A7A}
  .btn.on{background:#3b2a55;border-color:var(--violet)}
  input[type=date],input[type=time],input[type=number]{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:6px 8px}
  main{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
  @media (max-width:1100px){main{grid-template-columns:minmax(0,1fr)}}
  .fab{background:#161620;border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:16px;min-width:0}
  .fab h2{color:var(--c);font-size:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px}
  .uploads{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .up{position:relative;background:var(--panel);border:1px dashed var(--line2);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;font-weight:600}
  .up.ok{border-style:solid;border-color:#22c55e66}
  .up small{display:block;color:var(--mut);font-weight:400;font-size:10px}
  .up input{display:none}
  .sec{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .kpi .l{font-size:10px;font-weight:700;letter-spacing:.1em;color:#E5E7EB}
  .kpi .v{font-size:30px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:11px;color:var(--mut)}
  .kpi input{width:70px;text-align:center;background:transparent;border:none;border-bottom:1px dashed var(--line2);border-radius:0;font-size:30px;font-weight:800;color:var(--violet);padding:0}
  .kpi input::placeholder{color:var(--violet);opacity:.85}
  .bar{height:6px;background:#2A2A35;border-radius:4px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--green)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border-radius:8px;padding:6px 10px;font-weight:700;font-size:13px;border:1px solid;cursor:pointer;background:transparent}
  .chip b{font-size:18px;margin-right:4px}
  .chip.sel{outline:2px solid #ffffff55}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  .tbl th{text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:5px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
  .tbl td{padding:5px 6px;border-bottom:1px solid #2c2c36;vertical-align:top}
  .tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
  .tbl tr.cc td{background:#3b2a5533}
  .wrap{overflow-x:auto}
  .cod{font-weight:800;color:var(--c)}
  .desc{display:block;font-size:10.5px;color:var(--mut);font-weight:400;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{display:inline-block;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:700;border:1px solid;white-space:nowrap}
  select.situ{background:var(--panel);border:1px solid var(--line2);border-radius:5px;padding:2px 4px;font-size:11.5px}
  input.com{width:100%;min-width:110px;background:transparent;border:none;border-bottom:1px dashed var(--line2);padding:2px;font-size:12px}
  textarea{width:100%;min-height:70px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px;resize:vertical}
  .empty{color:var(--dim);font-style:italic;font-size:12px;padding:6px 0}
  .plan{display:flex;flex-direction:column;gap:4px}
  .pl{display:flex;gap:8px;align-items:center;font-size:12px;background:var(--panel);border-radius:6px;padding:4px 8px;border-left:3px solid #22c55e}
  .pl.hit{border-left-color:var(--red)}
  .pl .g{font-weight:800;color:#6ee7a0;min-width:66px}
  .pl .t{color:var(--mut);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
  #global{grid-column:1/-1;background:#161620;border:1px solid var(--line);border-top:3px solid var(--violet);border-radius:12px;padding:16px}
  #cfg{display:none;grid-column:1/-1;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px;gap:16px;flex-wrap:wrap;align-items:end}
  #cfg.open{display:flex}
  #cfg label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);font-weight:600}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0a3d1f;border:1px solid #22c55e;color:#bbf7d0;padding:8px 16px;border-radius:8px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  #toast.show{opacity:1}
  details summary{cursor:pointer;list-style:none}
  details summary::-webkit-details-marker{display:none}
  /* Modo presentación: oculta controles, agranda */
  body.present .uploads, body.present .noprint, body.present #cfg{display:none!important}
  body.present{font-size:15.5px}
  body.present .kpi .v, body.present .kpi input{font-size:40px}
  body.present select.situ, body.present input.com{border-color:transparent;-webkit-appearance:none;appearance:none;pointer-events:none}
  @media print{
    header .noprint,.uploads,#cfg{display:none!important}
    body{background:#fff;color:#111}
    header{position:static}
  }
</style>
</head>
<body>
<header>
  <h1>🚛 Reunión Transporte <span id="hdrDate"></span></h1>
  <input type="date" id="date" class="noprint" title="Día de la reunión"/>
  <button class="btn noprint" id="bPresent" title="Oculta controles de carga para proyectar">📽️ Presentar</button>
  <button class="btn noprint" id="bCopy" title="Copia un resumen en texto para el acta / Teams / correo">📋 Copiar resumen</button>
  <button class="btn noprint" id="bCfg">⚙️</button>
</header>

<main>
  <div id="cfg">
    <label>Inicio ventana noche<input type="time" id="cNocheIni"/></label>
    <label>Fin ventana noche<input type="time" id="cNocheFin"/></label>
    <label>Umbral alerta stock (≤ palés/uds de margen)<input type="number" id="cUmbral" min="1" style="width:90px"/></label>
    <button class="btn" id="bReset" style="border-color:#ef444477;color:#fca5a5">🗑️ Vaciar datos de este día</button>
    <span style="font-size:11px;color:var(--mut);max-width:420px">“Cargados noche” = camiones con carga finalizada cuyo <b>inicio planificado</b> cae en la ventana. Es una estimación: si el dato real difiere, escríbelo encima.</span>
  </div>
  <section class="fab" id="f-agrela" style="--c:#D946EF"></section>
  <section class="fab" id="f-moras"  style="--c:#38BDF8"></section>
  <section id="global"></section>
</main>
<div id="toast"></div>

<script>
// ───────────────────────── Constantes ─────────────────────────
const FABS = [
  { id:"agrela", label:"A Grela", color:"#D946EF" },
  { id:"moras",  label:"Moras",   color:"#38BDF8" },
];
const SITU = [
  { v:"Llenando",  bg:"#0a3d1f", txt:"#6ee7a0", br:"#22c55e" },
  { v:"Pendiente", bg:"#3d2200", txt:"#fcd34d", br:"#f59e0b" },
  { v:"Avería",    bg:"#3d0f0f", txt:"#fca5a5", br:"#ef4444" },
  { v:"No llena",  bg:"#22103d", txt:"#c4b5fd", br:"#8b5cf6" },
];
const SITU_MAP = Object.fromEntries(SITU.map(s => [s.v, s]));
const LS_DAY = "reunion_tr_";
const LS_CFG = "reunion_tr_cfg";

// ───────────────────────── Utilidades ─────────────────────────
const $ = (s, el=document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = (n) => String(n).padStart(2,"0");
const localISO = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtES = (iso) => { const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; };
const nowHM = () => new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
const fmtN = (n) => (Math.round(n*100)/100).toLocaleString("es-ES",{maximumFractionDigits:2});
const toMin = (hm) => { const m = String(hm||"").match(/(\d{1,2}):(\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; };
const sortCod = (a,b) => { const an=/^\d+$/.test(a.cod), bn=/^\d+$/.test(b.cod); if(an&&!bn) return -1; if(!an&&bn) return 1; if(an&&bn) return +a.cod - +b.cod; return a.cod.localeCompare(b.cod); };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }

// ───────────────────────── Estado ─────────────────────────
const emptyFab = () => ({ cargas:null, cargasHora:"", stocks:null, stocksHora:"", plan:[], planHora:"", pedidos:null, pedidosHora:"", nocheManual:"", notas:"", ll:{}, filtro:"rotura" });
let cfg = (() => { try { return { nocheIni:"22:00", nocheFin:"06:00", umbral:10, ...JSON.parse(localStorage.getItem(LS_CFG)||"{}") }; } catch(e) { return { nocheIni:"22:00", nocheFin:"06:00", umbral:10 }; } })();
let date = localISO();
let S = load(date);
let present = false;

function load(d){
  try { const raw = localStorage.getItem(LS_DAY+d); if (raw) { const o = JSON.parse(raw); return { agrela:{...emptyFab(),...o.agrela}, moras:{...emptyFab(),...o.moras}, global:o.global||"" }; } } catch(e) {}
  return { agrela:emptyFab(), moras:emptyFab(), global:"" };
}
function save(){
  try { localStorage.setItem(LS_DAY+date, JSON.stringify(S)); }
  catch(e){ toast("⚠️ No se pudo guardar (almacenamiento lleno o bloqueado)"); }
}
function saveCfg(){ try { localStorage.setItem(LS_CFG, JSON.stringify(cfg)); } catch(e) {} }

// ───────────────────────── Parsers (mismos criterios que Diario Fábrica) ─────────────────────────
function parseCargas(ab, fid){
  const wb = XLSX.read(ab, { type:"array" });
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, defval:null, raw:true });
  if (rows.length < 2) throw new Error("Excel vacío");
  const h = rows[0].map(x => x ? String(x).trim() : "");
  const iStatus  = h.findIndex(x => x.includes("Transp") && x.includes("Status"));
  const iTransp  = h.findIndex(x => x.includes("Número de transporte"));
  const iCli     = h.findIndex(x => x.includes("Nombre Destinatario"));
  const iIni     = h.findIndex(x => x.includes("Inicio carga planificada"));
  const iAg      = h.findIndex(x => x.includes("Nombre transportista"));
  const iSys     = h.findIndex(x => x.includes("Systore") && x.includes("Status"));
  if (iStatus < 0 || iTransp < 0) throw new Error("No encuentro columnas de Status / Número de transporte");
  const seen = new Set(), uniq = [];
  rows.slice(1).forEach(r => {
    const st = r[iStatus] !== null && r[iStatus] !== "" ? parseInt(String(r[iStatus])) : NaN;
    const n = r[iTransp] ? String(r[iTransp]).trim() : "";
    if (isNaN(st) || !n || seen.has(n)) return;
    seen.add(n);
    const iniRaw = iIni >= 0 && r[iIni] ? String(r[iIni]).trim() : "";
    const mH = iniRaw.match(/(\d{2}:\d{2})(?:-(\d{2}:\d{2}))?$/);
    const sys = iSys >= 0 && r[iSys] !== null && r[iSys] !== "" ? parseInt(String(r[iSys])) : null;
    uniq.push({ st, n, cli: iCli>=0 && r[iCli] ? String(r[iCli]).trim() : "", ag: iAg>=0 && r[iAg] ? String(r[iAg]).trim() : "", ini: mH ? mH[1] : iniRaw, sys: isNaN(sys) ? null : sys });
  });
  const hasSys = fid === "agrela" && iSys >= 0 && uniq.filter(c => c.sys !== null).length > uniq.length * 0.3;
  const isEnCarga = c => hasSys ? (c.sys === 3 && [2,3].includes(c.st)) : c.st === 3;
  const isFin     = c => c.st >= 4;
  const isReg     = c => hasSys ? (c.st === 2 && [1,2].includes(c.sys)) : c.st === 2;
  const isPend    = c => hasSys ? (c.st === 1 && [1,2].includes(c.sys)) : [0,1].includes(c.st);
  const pend = uniq.filter(isPend), reg = uniq.filter(isReg), enc = uniq.filter(isEnCarga), fin = uniq.filter(isFin);
  return {
    total: pend.length + reg.length + enc.length + fin.length,
    pendientes: pend.length, registrados: reg.length, enCarga: enc.length, fin: fin.length,
    finList: fin.map(c => ({ n:c.n, cli:c.cli, ag:c.ag, ini:c.ini })),
  };
}

function parseStocksXlsx(ab){
  const wb = XLSX.read(ab, { type:"array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
  const toNum = v => (v===null||v===undefined||v==="") ? 0 : (typeof v === "number" ? v : parseFloat(String(v).replace(/\./g,"").replace(",",".")) || 0);
  const codes = {};
  for (let c = 1; c <= range.e.c; c++) {
    const cell = ws[XLSX.utils.encode_cell({r:0,c})];
    if (cell) { const v = cell.v; codes[c] = typeof v === "number" ? String(Math.round(v)).padStart(4,"0") : String(v).trim(); }
  }
  const getRow = (lbl) => {
    for (let r = 1; r <= range.e.r; r++) {
      const cell = ws[XLSX.utils.encode_cell({r,c:0})];
      if (cell && String(cell.v).toUpperCase().includes(lbl)) { const o={}; for (let c=1;c<=range.e.c;c++){ const rc=ws[XLSX.utils.encode_cell({r,c})]; o[c]=rc?rc.v:null; } return o; }
    }
    return {};
  };
  const P = getRow("TOTAL PEDIDOS"), F = getRow("FÍSICO"), D = getRow("DISPONIBLE"), B = getRow("BLOQUEADO"), T = getRow("TRÁNSITO");
  if (!Object.keys(P).length || !Object.keys(D).length) throw new Error("No encuentro filas TOTAL PEDIDOS / DISPONIBLE");
  return Object.entries(codes).map(([c,cod]) => ({ cod, ped:toNum(P[c]), fis:toNum(F[c]), dis:toNum(D[c]), bloq:toNum(B[c]), tra:toNum(T[c]) }));
}

function parseStocksXml(text){
  const rows = []; const re = /<Row[^>]*>([\s\S]*?)<\/Row>/g; let m;
  const t = text.replace(/^﻿/,"");
  while ((m = re.exec(t)) !== null) rows.push(m[1]);
  if (rows.length < 4) throw new Error("Formato XML no reconocido");
  const toNum = s => parseFloat((s||"0").replace(/\./g,"").replace(",",".")) || 0;
  const byCol = (row) => {
    const map = {}; let cur = 1;
    const ex = (row||"").replace(/<Cell([^>]*)\/>/g,'<Cell$1><Data ss:Type="String">__MT__</Data></Cell>');
    const rc = /<Cell([^>]*)>([\s\S]*?)<\/Cell>/g; let cm;
    while ((cm = rc.exec(ex)) !== null) { const ix = cm[1].match(/ss:Index="(\d+)"/); if (ix) cur = +ix[1]; const dm = cm[2].match(/<Data[^>]*>([\s\S]*?)<\/Data>/); const v = dm ? dm[1].trim() : null; if (v && v !== "__MT__") map[cur] = v; cur++; }
    return map;
  };
  const C = byCol(rows[0]), P = byCol(rows[1]), F = byCol(rows[2]), D = byCol(rows[3]), B = byCol(rows[6]), T = byCol(rows[7]);
  return Object.entries(C).filter(([c]) => +c > 1).sort((a,b)=>+a[0]-+b[0]).map(([c,cod]) => ({ cod, ped:toNum(P[c]), fis:toNum(F[c]), dis:toNum(D[c]), bloq:toNum(B[c]), tra:toNum(T[c]) }));
}

function parsePlan(ab){
  const wb = XLSX.read(ab, { type:"array", cellDates:true });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
  const gv = (r,c) => { const cell = ws[XLSX.utils.encode_cell({r,c})]; return cell ? cell.v : null; };
  const cs = v => v ? String(v).replace(/\xa0/g,"").replace(/\s+/g," ").trim() : "";
  const hd = v => {
    if (!v) return { h:"", d:"" };
    if (v instanceof Date) { v = new Date(Math.round(v.getTime()/60000)*60000); }
    if (v instanceof Date) return { h:`${pad(v.getHours())}:${pad(v.getMinutes())}`, d:`${pad(v.getDate())}/${pad(v.getMonth()+1)}` };
    if (typeof v === "number") { const tm = Math.round((v-Math.floor(v))*1440); const dt = new Date(Math.round((v-25569)*864e5)); return { h:`${pad(Math.floor(tm/60)%24)}:${pad(tm%60)}`, d:`${pad(dt.getUTCDate())}/${pad(dt.getUTCMonth()+1)}` }; }
    const s = String(v).trim(); const m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})\s+(\d{1,2}):(\d{2})/);
    return m ? { h:`${m[4].padStart(2,"0")}:${m[5]}`, d:`${m[1].padStart(2,"0")}/${m[2].padStart(2,"0")}` } : { h:s, d:"" };
  };
  const norm = v => { if (!v) return ""; let s = String(v).trim().replace(/\xa0/g,""); if (/^700\d/.test(s)) return s.slice(3).padStart(4,"0"); if (/^70[A-Z]/.test(s)) return s.slice(2); if (/^70\d/.test(s)) return s.slice(2).padStart(4,"0"); const n = parseFloat(s); return isNaN(n) ? s : String(Math.round(n)).slice(-4).padStart(4,"0"); };
  let grp = "", iCod=-1, iDesc=-1, iHi=-1, iHf=-1; const out = [];
  for (let r = 0; r <= range.e.r; r++) {
    const raw = [], vals = [];
    for (let c = 0; c <= range.e.c; c++) { const v = gv(r,c); raw.push(v); vals.push(cs(v)); }
    const g = vals.find(v => /Grupo:\s*EG\d+/i.test(v));
    if (g) { const m = g.match(/EG(\d+)/i); grp = m ? `GRUPO ${parseInt(m[1])}` : g; iCod=iDesc=iHi=iHf=-1; continue; }
    if (vals.includes("Código") || vals.includes("No Orden")) { iCod=vals.indexOf("Código"); iDesc=vals.indexOf("Descripción"); iHi=vals.indexOf("Inicio Orden"); iHf=vals.indexOf("Fin Orden"); continue; }
    if (!grp || iCod < 0 || !raw[iCod]) continue;
    const a = iHi>=0 ? hd(raw[iHi]) : {h:"",d:""}, b = iHf>=0 ? hd(raw[iHf]) : {h:"",d:""};
    const cod = norm(raw[iCod]);
    if (cod && (a.h || b.h)) out.push({ g:grp, cod, desc: iDesc>=0 ? cs(raw[iDesc]) : "", d:a.d, hi:a.h, df:b.d||a.d, hf:b.h });
  }
  const key = p => { const [dd,mm] = (p.d||"99/99").split("/"); return mm+dd+(p.hi||"99:99"); };
  return out.sort((x,y) => key(x).localeCompare(key(y)));
}

function parsePedidos(ab){
  const wb = XLSX.read(ab, { type:"array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:null, raw:true });
  if (rows.length < 2) throw new Error("Excel vacío");
  const h = rows[0].map(x => x ? String(x).trim() : "");
  const find = (names) => { for (const n of names) { const i = h.findIndex(x => x && x.toLowerCase().includes(n.toLowerCase())); if (i>=0) return i; } return -1; };
  const iCli = find(["Nombre Destinatario","destinatario"]), iTr = find(["Transp.","Transporte"]);
  const prod = {}; h.forEach((x,i) => { if (/^\d{4}$/.test(x) || /^[A-Z]\d{3}$/.test(x)) prod[x] = i; });
  const map = {};
  rows.slice(1).forEach(r => {
    const cli = iCli>=0 && r[iCli] ? String(r[iCli]).trim() : "", tr = iTr>=0 && r[iTr] ? String(r[iTr]).trim() : "";
    Object.entries(prod).forEach(([cod,ci]) => {
      const q = typeof r[ci] === "number" ? r[ci] : parseFloat(String(r[ci]??"").replace(",","."));
      if (!isNaN(q) && q > 0) (map[cod] ||= []).push({ cli, tr, q });
    });
  });
  return map;
}

// ───────────────────────── Cálculos ─────────────────────────
function inNight(hm){
  const t = toMin(hm), a = toMin(cfg.nocheIni), b = toMin(cfg.nocheFin);
  if (t === null || a === null || b === null) return false;
  return a <= b ? (t >= a && t < b) : (t >= a || t < b);
}
function nocheAuto(fd){ return fd.cargas ? fd.cargas.finList.filter(c => inNight(c.ini)).length : null; }
function nocheVal(fd){ return fd.nocheManual !== "" && fd.nocheManual != null ? +fd.nocheManual : nocheAuto(fd); }

function stockRows(fd){
  if (!fd.stocks) return [];
  return fd.stocks.map(a => ({ ...a, diff: a.dis - a.ped }));
}
function clasif(fd){
  const rs = stockRows(fd);
  return {
    rotura: rs.filter(r => r.ped > 0 && r.diff < 0).sort(sortCod),
    justo:  rs.filter(r => r.ped > 0 && r.diff === 0).sort(sortCod),
    alerta: rs.filter(r => r.ped > 0 && r.diff > 0 && r.diff <= cfg.umbral).sort(sortCod),
  };
}
const otra = fid => fid === "agrela" ? "moras" : "agrela";
const labelOf = fid => FABS.find(f => f.id === fid).label;

// ¿Puede la otra fábrica cubrir el déficit?
function cambioCentro(fid, r){
  const o = S[otra(fid)];
  if (!o.stocks) return { k:"nd", txt:"Sin stock " + labelOf(otra(fid)) };
  const a = o.stocks.find(x => x.cod === r.cod);
  if (!a) return { k:"no", txt:"No existe en " + labelOf(otra(fid)) };
  const margen = a.dis - a.ped, falta = -r.diff;
  if (margen >= falta) return { k:"si", txt:`${labelOf(otra(fid))} cubre (margen ${fmtN(margen)})`, margen };
  if (margen > 0)      return { k:"parcial", txt:`Parcial: ${labelOf(otra(fid))} margen ${fmtN(margen)}`, margen };
  return { k:"no", txt:`${labelOf(otra(fid))} sin margen (${fmtN(margen)})`, margen };
}
const CC_STY = { si:["#0a3d1f","#6ee7a0","#22c55e"], parcial:["#3d2200","#fcd34d","#f59e0b"], no:["#1c1c22","#9CA3AF","#3F3F46"], nd:["#1c1c22","#606070","#2A2A35"] };

function proxLlenado(fd, cod){
  const ps = (fd.plan||[]).filter(p => p.cod === cod);
  return ps[0] || null;
}
function descOf(fid, cod){
  for (const f of [fid, otra(fid)]) { const p = (S[f].plan||[]).find(x => x.cod === cod && x.desc); if (p) return p.desc; }
  return "";
}

// ───────────────────────── Render ─────────────────────────
function renderFab(fab){
  const fd = S[fab.id], el = $("#f-"+fab.id), cg = fd.cargas;
  const up = (key, lbl, accept, hora) => `<label class="up ${hora?"ok":""}">${lbl}<small>${hora ? "✓ "+esc(hora) : "Subir Excel"}</small><input type="file" accept="${accept}" data-up="${key}" data-fid="${fab.id}"/></label>`;
  const noche = nocheVal(fd), nAuto = nocheAuto(fd);
  const pct = cg && cg.total ? Math.round(cg.fin / cg.total * 100) : 0;
  const cl = clasif(fd);
  const filtro = fd.filtro || "rotura";
  const list = cl[filtro] || [];

  const kpi = (l, v, color, sub="") => `<div class="kpi"><div class="l">${l}</div><div class="v" style="color:${color}">${v}</div><div class="s">${sub}</div></div>`;

  let stockHtml;
  if (!fd.stocks) stockHtml = `<div class="empty">Sube el Excel/XML de stocks SAP.</div>`;
  else {
    const chip = (k, lbl, col) => `<button class="chip ${filtro===k?"sel":""}" data-filtro="${k}" data-fid="${fab.id}" style="border-color:${col};color:${col}"><b>${cl[k].length}</b>${lbl}</button>`;
    stockHtml = `<div class="chips">${chip("rotura","Roturas","#EF4444")}${chip("justo","Justos","#38BDF8")}${chip("alerta","Alerta ≤"+cfg.umbral,"#F59E0B")}</div>`;
    if (!list.length) stockHtml += `<div class="empty">Ninguna referencia en este estado.</div>`;
    else {
      stockHtml += `<div class="wrap"><table class="tbl"><thead><tr><th>Cód.</th><th class="n">Pedidos</th><th class="n">Disp.</th><th class="n">Dif.</th><th>Próx. llenado</th><th>Situación</th><th>Cambio de centro</th><th>Comentario</th></tr></thead><tbody>`;
      list.forEach(r => {
        const ll = fd.ll[r.cod] || {};
        const s = SITU_MAP[ll.situ];
        const p = proxLlenado(fd, r.cod);
        const cc = r.diff < 0 ? cambioCentro(fab.id, r) : null;
        const ccs = cc ? CC_STY[cc.k] : null;
        const nCli = fd.pedidos?.[r.cod] ? new Set(fd.pedidos[r.cod].map(x=>x.cli)).size : null;
        stockHtml += `<tr class="${ll.cambio?"cc":""}">
          <td><span class="cod" style="${s?"color:"+s.txt:""}">${esc(r.cod)}</span><span class="desc" title="${esc(descOf(fab.id,r.cod))}">${esc(descOf(fab.id,r.cod))}</span>${nCli!==null?`<span class="desc">${nCli} cliente${nCli!==1?"s":""}</span>`:""}</td>
          <td class="n">${fmtN(r.ped)}</td>
          <td class="n" style="${r.dis<0?"color:#EF4444;font-weight:700":""}">${fmtN(r.dis)}</td>
          <td class="n" style="font-weight:800;color:${r.diff<0?"#EF4444":r.diff===0?"#38BDF8":"#F59E0B"}">${fmtN(r.diff)}</td>
          <td>${p ? `<span class="tag" style="background:#0a3d1f;color:#6ee7a0;border-color:#22c55e">${esc(p.g.replace("GRUPO ","G"))} · ${esc(p.d)} ${esc(p.hi)}→${esc(p.hf)}</span>` : `<span style="color:#606070">—</span>`}</td>
          <td><select class="situ" data-ll="situ" data-fid="${fab.id}" data-cod="${esc(r.cod)}" style="${s?`background:${s.bg};color:${s.txt};border-color:${s.br}`:""}"><option value="">—</option>${SITU.map(o=>`<option ${ll.situ===o.v?"selected":""}>${o.v}</option>`).join("")}</select></td>
          <td>${cc ? `<label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" data-ll="cambio" data-fid="${fab.id}" data-cod="${esc(r.cod)}" ${ll.cambio?"checked":""} title="Marcar como cambio de centro propuesto"/><span class="tag" style="background:${ccs[0]};color:${ccs[1]};border-color:${ccs[2]}">${esc(cc.txt)}</span></label>` : `<span style="color:#606070">—</span>`}</td>
          <td><input class="com" data-ll="com" data-fid="${fab.id}" data-cod="${esc(r.cod)}" value="${esc(ll.com||"")}" placeholder="…"/></td>
        </tr>`;
      });
      stockHtml += `</tbody></table></div>`;
    }
  }

  // Llenados: plan de envasado (hoy + lo cargado), resaltando los que cubren roturas/justos
  const riesgo = new Set([...cl.rotura, ...cl.justo].map(r => r.cod));
  let planHtml;
  if (!fd.plan?.length) planHtml = `<div class="empty">Sube la planificación de envasado.</div>`;
  else {
    const hits = fd.plan.filter(p => riesgo.has(p.cod));
    const rest = fd.plan.filter(p => !riesgo.has(p.cod));
    const row = p => `<div class="pl ${riesgo.has(p.cod)?"hit":""}"><span class="g">${esc(p.g)}</span><span><b>${esc(p.cod)}</b> <span style="color:var(--mut)">${esc(p.desc)}</span></span><span class="t">${esc(p.d)} ${esc(p.hi)} → ${esc(p.df)} ${esc(p.hf)}</span></div>`;
    planHtml = `<div class="plan">${hits.length ? hits.map(row).join("") : `<div class="empty">Ningún llenado planificado cubre las roturas actuales.</div>`}</div>
      <details style="margin-top:6px"><summary style="font-size:12px;color:var(--mut)">▸ Ver resto del plan (${rest.length})</summary><div class="plan" style="margin-top:6px">${rest.map(row).join("")}</div></details>`;
  }

  el.innerHTML = `
    <h2>🏭 ${fab.label}</h2>
    <div class="uploads">
      ${up("cargas","🚛 Cargas",".xlsx,.xls",fd.cargasHora)}
      ${up("stocks","📦 Stocks SAP",".xlsx,.xls,.xml",fd.stocksHora)}
      ${up("plan","📅 Planificación",".xlsx,.xls",fd.planHora)}
      ${up("pedidos","🧾 Pedidos (opc.)",".xlsx,.xls",fd.pedidosHora)}
    </div>

    <div class="sec">Camiones</div>
    <div class="kpis">
      ${kpi("TOTALES", cg ? cg.total : "—", fab.color, cg ? `${cg.fin} finalizados` : "")}
      ${kpi("PENDIENTES", cg ? cg.pendientes + cg.registrados : "—", "#EF4444", cg ? `${cg.pendientes} sin llegar · ${cg.registrados} registrados` : "")}
      ${kpi("EN CARGA", cg ? cg.enCarga : "—", "#22C55E")}
      <div class="kpi"><div class="l">CARGADOS NOCHE</div>
        <input type="number" min="0" data-noche="${fab.id}" value="${fd.nocheManual!==""&&fd.nocheManual!=null?esc(fd.nocheManual):""}" placeholder="${nAuto ?? "—"}"/>
        <div class="s">${nAuto!==null ? `auto ${nAuto} (${esc(cfg.nocheIni)}–${esc(cfg.nocheFin)})` : "manual"}${fd.nocheManual!==""&&fd.nocheManual!=null?' · <a href="#" data-nocheclr="'+fab.id+'" style="color:var(--mut)">usar auto</a>':""}</div>
      </div>
    </div>
    ${cg ? `<div class="bar" title="${pct}% del total ya cargado"><i style="width:${pct}%"></i></div><div style="font-size:11px;color:var(--mut);margin-top:4px">${pct}% cargado</div>` : ""}

    <div class="sec">Stocks · roturas y cambios de centro</div>
    ${stockHtml}

    <div class="sec">Llenados de envasado ${fd.plan?.length ? `<span style="text-transform:none;letter-spacing:0;font-weight:500">· en rojo los que cubren roturas/justos</span>`:""}</div>
    ${planHtml}

    <div class="sec">Notas ${fab.label}</div>
    <textarea data-notas="${fab.id}" placeholder="Incidencias, averías, observaciones…">${esc(fd.notas)}</textarea>
  `;
}

function renderGlobal(){
  const el = $("#global");
  const props = [];
  FABS.forEach(f => {
    const fd = S[f.id];
    clasif(fd).rotura.forEach(r => { if (fd.ll[r.cod]?.cambio) props.push({ f, r, cc: cambioCentro(f.id, r), com: fd.ll[r.cod]?.com || "" }); });
  });
  const tot = (k) => FABS.reduce((s,f) => { const c = S[f.id].cargas; return c ? s + (k==="pend" ? c.pendientes + c.registrados : c[k]) : s; }, 0);
  const anyC = FABS.some(f => S[f.id].cargas);
  const noche = FABS.reduce((s,f) => s + (nocheVal(S[f.id]) || 0), 0);
  const rot = FABS.reduce((s,f) => s + clasif(S[f.id]).rotura.length, 0);
  el.innerHTML = `
    <h2 style="color:var(--violet);font-size:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px">📊 Total grupo · ${fmtES(date)}</h2>
    <div class="kpis">
      <div class="kpi"><div class="l">TOTALES</div><div class="v">${anyC ? tot("total") : "—"}</div></div>
      <div class="kpi"><div class="l">PENDIENTES</div><div class="v" style="color:#EF4444">${anyC ? tot("pend") : "—"}</div></div>
      <div class="kpi"><div class="l">CARGADOS NOCHE</div><div class="v" style="color:var(--violet)">${anyC || noche ? noche : "—"}</div></div>
      <div class="kpi"><div class="l">ROTURAS</div><div class="v" style="color:#EF4444">${FABS.some(f=>S[f.id].stocks) ? rot : "—"}</div></div>
    </div>
    <div class="sec">🔁 Cambios de centro propuestos</div>
    ${props.length ? `<div class="wrap"><table class="tbl"><thead><tr><th>Cód.</th><th>De</th><th>A</th><th class="n">Falta</th><th>Cobertura</th><th>Comentario</th></tr></thead><tbody>
      ${props.map(p => { const s = CC_STY[p.cc.k]; return `<tr><td class="cod" style="--c:${p.f.color}">${esc(p.r.cod)} <span class="desc">${esc(descOf(p.f.id,p.r.cod))}</span></td><td>${p.f.label}</td><td>${labelOf(otra(p.f.id))}</td><td class="n" style="color:#EF4444;font-weight:700">${fmtN(-p.r.diff)}</td><td><span class="tag" style="background:${s[0]};color:${s[1]};border-color:${s[2]}">${esc(p.cc.txt)}</span></td><td>${esc(p.com)}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="empty">Marca la casilla “Cambio de centro” en una rotura para que aparezca aquí.</div>`}
    <div class="sec">Acuerdos de la reunión</div>
    <textarea data-global="1" placeholder="Acuerdos, responsables, seguimiento…">${esc(S.global)}</textarea>
  `;
}

function render(){
  $("#hdrDate").textContent = fmtES(date);
  $("#date").value = date;
  FABS.forEach(renderFab);
  renderGlobal();
}

// ───────────────────────── Resumen texto ─────────────────────────
function resumen(){
  const L = [`REUNIÓN TRANSPORTE · ${fmtES(date)}`, ""];
  FABS.forEach(f => {
    const fd = S[f.id], c = fd.cargas, cl = clasif(fd);
    L.push(`■ ${f.label.toUpperCase()}`);
    if (c) L.push(`  Camiones: ${c.total} totales · ${c.pendientes + c.registrados} pendientes · ${c.enCarga} en carga · ${nocheVal(fd) ?? "—"} cargados noche`);
    else if (fd.nocheManual) L.push(`  Cargados noche: ${fd.nocheManual}`);
    if (fd.stocks) {
      L.push(`  Stocks: ${cl.rotura.length} roturas · ${cl.justo.length} justos · ${cl.alerta.length} en alerta (≤${cfg.umbral})`);
      cl.rotura.forEach(r => {
        const ll = fd.ll[r.cod] || {}, p = proxLlenado(fd, r.cod), d = descOf(f.id, r.cod);
        const parts = [`    - ${r.cod}${d?" "+d:""}: falta ${fmtN(-r.diff)}`];
        if (p) parts.push(`llenado ${p.g} ${p.d} ${p.hi}`);
        if (ll.situ) parts.push(ll.situ);
        if (ll.cambio) parts.push(`→ CAMBIO A ${labelOf(otra(f.id)).toUpperCase()} (${cambioCentro(f.id, r).txt})`);
        if (ll.com) parts.push(ll.com);
        L.push(parts.join(" · "));
      });
    }
    if (fd.notas.trim()) L.push(`  Notas: ${fd.notas.trim()}`);
    L.push("");
  });
  if (S.global.trim()) { L.push("■ ACUERDOS"); L.push(S.global.trim()); }
  return L.join("\n");
}

// ───────────────────────── Eventos ─────────────────────────
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.up) {
    const file = t.files[0]; if (!file) return;
    const fid = t.dataset.fid, fd = S[fid], kind = t.dataset.up;
    try {
      if (kind === "stocks" && /\.xml$/i.test(file.name)) { fd.stocks = parseStocksXml(await file.text()); }
      else {
        const ab = await file.arrayBuffer();
        if (kind === "cargas")  fd.cargas  = parseCargas(ab, fid);
        if (kind === "stocks")  fd.stocks  = parseStocksXlsx(ab);
        if (kind === "plan")    fd.plan    = parsePlan(ab);
        if (kind === "pedidos") fd.pedidos = parsePedidos(ab);
      }
      fd[kind+"Hora"] = nowHM();
      save(); render();
      const msg = { cargas: () => `${fd.cargas.total} camiones`, stocks: () => `${clasif(fd).rotura.length} roturas`, plan: () => `${fd.plan.length} órdenes`, pedidos: () => `${Object.keys(fd.pedidos).length} referencias` }[kind]();
      toast(`✓ ${labelOf(fid)}: ${msg}`);
    } catch(err) { console.error(err); toast("⚠️ " + err.message); }
    t.value = "";
    return;
  }
  if (t.dataset.ll) {
    const fd = S[t.dataset.fid], cod = t.dataset.cod;
    fd.ll[cod] = { ...(fd.ll[cod]||{}), [t.dataset.ll]: t.type === "checkbox" ? t.checked : t.value };
    save();
    if (t.dataset.ll !== "com") render();
    else renderGlobal();
    return;
  }
  if (t.id === "date") { date = t.value || localISO(); S = load(date); render(); return; }
  if (t.id === "cNocheIni" || t.id === "cNocheFin" || t.id === "cUmbral") {
    cfg.nocheIni = $("#cNocheIni").value || "22:00";
    cfg.nocheFin = $("#cNocheFin").value || "06:00";
    cfg.umbral = Math.max(1, +$("#cUmbral").value || 10);
    saveCfg(); render();
  }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.notas) { S[t.dataset.notas].notas = t.value; save(); }
  else if (t.dataset.global) { S.global = t.value; save(); }
  else if (t.dataset.noche) { S[t.dataset.noche].nocheManual = t.value; save(); }
});
document.addEventListener("focusout", (e) => { if (e.target.dataset.noche) render(); });
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-filtro],[data-nocheclr]");
  if (!t) return;
  if (t.dataset.filtro) { S[t.dataset.fid].filtro = t.dataset.filtro; save(); render(); }
  if (t.dataset.nocheclr) { e.preventDefault(); S[t.dataset.nocheclr].nocheManual = ""; save(); render(); }
});
$("#bPresent").onclick = () => { present = !present; document.body.classList.toggle("present", present); $("#bPresent").classList.toggle("on", present); };
$("#bCfg").onclick = () => $("#cfg").classList.toggle("open");
$("#bCopy").onclick = async () => {
  const txt = resumen();
  try { await navigator.clipboard.writeText(txt); toast("✓ Resumen copiado"); }
  catch(e) { const w = window.open("", "_blank"); if (w) { w.document.body.innerHTML = "<pre></pre>"; w.document.querySelector("pre").textContent = txt; } }
};
$("#bReset").onclick = () => {
  if (!confirm(`¿Vaciar todos los datos del ${fmtES(date)}?`)) return;
  try { localStorage.removeItem(LS_DAY+date); } catch(e) {}
  S = load(date); render(); toast("Datos del día vaciados");
};
$("#cNocheIni").value = cfg.nocheIni; $("#cNocheFin").value = cfg.nocheFin; $("#cUmbral").value = cfg.umbral;
render();
</script>
</body>
</html>
